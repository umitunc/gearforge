server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Güvenlik ve Arama Motoru / AI Başlıkları
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip sıkıştırma desteği
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/ld+json
        image/svg+xml;

    # AI ve LLM Standartları (CORS Serbest - ChatGPT, Claude, Gemini, Perplexity erişimi)
    location ~* ^/(llms\.txt|llms-full\.txt|robots\.txt|sitemap\.xml)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Statik varlıklar için önbellek kontrolü (İçerik değiştiğinde hash'lenir)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg|stl|obj|webmanifest)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # SPA yönlendirmesi
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
